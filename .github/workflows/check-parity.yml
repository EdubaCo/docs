name: Check docs file parity
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  check-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node check-parity.mjs
